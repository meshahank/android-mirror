name: Build Android Mirror
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download Gradle 8.7
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        working-directory: android
        run: /tmp/gradle-8.7/bin/gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: Android-Mirror-APK, path: android/app/build/outputs/apk/debug/app-debug.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: desktop/package.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows bundles
        working-directory: desktop
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with: { name: Android-Mirror-Windows, path: desktop/src-tauri/target/release/bundle/** }
