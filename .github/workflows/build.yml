name: Build Android Mirror

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download Gradle 8.7
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        working-directory: android
        run: /tmp/gradle-8.7/bin/gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Mirror-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: desktop/package.json }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows bundles
        working-directory: desktop
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Mirror-Windows
          path: desktop/src-tauri/target/release/bundle/**

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Prepare direct downloads
        shell: bash
        run: |
          mkdir -p release
          cp "$(find dist/Android-Mirror-APK -type f -name '*.apk' -print -quit)" release/Android-Mirror.apk
          cp "$(find dist/Android-Mirror-Windows -type f -iname '*.exe' -print -quit)" release/Android-Mirror-Setup.exe
      - name: Publish direct test downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-test
          name: Latest test build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            release/Android-Mirror.apk
            release/Android-Mirror-Setup.exe
          fail_on_unmatched_files: true
          overwrite_files: true
